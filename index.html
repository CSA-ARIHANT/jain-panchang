<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>जैन पाठशाला</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{
  --sky:#e0f2fe;--sky-mid:#bae6fd;--sky-dark:#0369a1;--sky-deeper:#075985;
  --navy:#0c1a2e;--navy-mid:#1e3a5f;--gold:#f59e0b;--gold-light:#fcd34d;
  --white:#fff;--r:10px;--rl:14px;
}
body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--sky);color:var(--navy-mid);min-height:100vh;display:flex;flex-direction:column;}
.app-header{background:linear-gradient(135deg,#0c4a6e,#075985);border-bottom:3px solid var(--gold);padding:12px 20px;display:flex;align-items:center;gap:14px;position:sticky;top:0;z-index:100;}
.logo{width:48px;height:48px;background:var(--gold);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:24px;color:var(--navy);font-weight:900;border:2px solid var(--white);flex-shrink:0;}
.title-group h1{font-size:20px;font-weight:700;color:var(--gold-light);}
.title-group p{font-size:11px;color:#bae6fd;margin-top:2px;}
.header-right{margin-left:auto;flex-shrink:0;}
.title-group{min-width:0;flex:1;}
.title-group h1{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
@media(max-width:480px){
  .app-header{padding:10px 12px;gap:8px;}
  .logo{width:36px;height:36px;font-size:16px;}
  .title-group h1{font-size:15px;}
  .title-group p{font-size:9px;}
  #liveClock{display:none!important;}
  .btn-logout{padding:6px 10px;font-size:12px;}
}
.app-main{flex:1;padding:20px 16px;max-width:1100px;margin:0 auto;width:100%;}
.app-footer{background:linear-gradient(135deg,#0c4a6e,#075985);border-top:3px solid var(--gold);text-align:center;padding:12px;font-size:13px;color:#bae6fd;font-weight:600;}
/* BUTTONS 3D */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:none;border-radius:var(--r);cursor:pointer;font-size:14px;font-weight:700;position:relative;top:0;transition:all .12s;padding:9px 18px;}
.btn-gold{background:linear-gradient(160deg,#fcd34d,#f59e0b);color:#0c1a2e;box-shadow:0 6px 0 #b45309,0 8px 12px rgba(180,83,9,.3);}
.btn-gold:hover{top:3px;box-shadow:0 3px 0 #b45309,0 5px 8px rgba(180,83,9,.2);}
.btn-gold:active{top:6px;box-shadow:0 1px 0 #b45309;}
.btn-sky{background:linear-gradient(160deg,#38bdf8,#0369a1);color:#fff;box-shadow:0 6px 0 #075985,0 8px 12px rgba(7,89,133,.3);}
.btn-sky:hover{top:3px;box-shadow:0 3px 0 #075985,0 5px 8px rgba(7,89,133,.2);}
.btn-sky:active{top:6px;box-shadow:0 1px 0 #075985;}
.btn-red{background:linear-gradient(160deg,#fca5a5,#dc2626);color:#fff;box-shadow:0 6px 0 #991b1b,0 8px 12px rgba(153,27,27,.3);}
.btn-red:hover{top:3px;box-shadow:0 3px 0 #991b1b;}
.btn-red:active{top:6px;box-shadow:0 1px 0 #991b1b;}
.btn-green{background:linear-gradient(160deg,#86efac,#16a34a);color:#fff;box-shadow:0 6px 0 #15803d,0 8px 12px rgba(21,128,61,.3);}
.btn-green:hover{top:3px;box-shadow:0 3px 0 #15803d;}
.btn-green:active{top:6px;box-shadow:0 1px 0 #15803d;}
.btn-ghost{background:rgba(255,255,255,.7);color:var(--sky-deeper);border:1.5px solid var(--sky-mid);box-shadow:0 4px 0 #7dd3fc,0 6px 8px rgba(3,105,161,.1);}
.btn-ghost:hover{top:2px;box-shadow:0 2px 0 #7dd3fc;}
.btn-ghost:active{top:4px;box-shadow:0 1px 0 #7dd3fc;}
.btn-sm{padding:5px 11px;font-size:12px;}
.btn-w{width:100%;}
.btn-logout{background:linear-gradient(160deg,#fcd34d,#f59e0b);color:#0c1a2e;border:none;border-radius:6px;padding:6px 14px;font-size:13px;font-weight:700;cursor:pointer;box-shadow:0 4px 0 #b45309;position:relative;top:0;transition:all .12s;}
.btn-logout:hover{top:2px;box-shadow:0 2px 0 #b45309;}
/* CARDS */
.card{background:#fff;border:1.5px solid var(--sky-mid);border-radius:var(--rl);padding:20px;box-shadow:0 4px 16px rgba(3,105,161,.1);}
.card-title{color:var(--sky-deeper);font-size:16px;font-weight:700;margin-bottom:14px;display:flex;align-items:center;gap:8px;}
/* STAT */
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:18px;}
.stat-card{background:linear-gradient(135deg,#0c4a6e,#075985);border-radius:var(--r);padding:14px;text-align:center;box-shadow:0 4px 0 #0c2a4a,0 6px 12px rgba(12,42,78,.3);}
.sc-val{font-size:24px;font-weight:700;color:var(--gold-light);}
.sc-label{font-size:11px;color:#bae6fd;margin-top:3px;}
/* TABS */
.tabs{display:flex;gap:6px;margin-bottom:18px;flex-wrap:wrap;}
.tab{padding:7px 16px;border-radius:8px;cursor:pointer;font-size:13px;font-weight:600;background:#fff;border:1.5px solid #7dd3fc;color:var(--sky-deeper);box-shadow:0 4px 0 #7dd3fc,0 6px 8px rgba(3,105,161,.1);position:relative;top:0;transition:all .12s;}
.tab.active{background:linear-gradient(160deg,#fcd34d,#f59e0b);color:var(--navy);border-color:#f59e0b;box-shadow:0 2px 0 #b45309;top:2px;}
.tab:hover:not(.active){top:2px;box-shadow:0 2px 0 #7dd3fc;}
/* PIN */
.pin-display{display:flex;gap:10px;justify-content:center;margin:14px 0;}
.pin-dot{width:16px;height:16px;border-radius:50%;border:2px solid var(--gold);background:transparent;transition:background .15s;}
.pin-dot.filled{background:var(--gold);}
.pin-pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-width:220px;margin:0 auto;}
.pin-key{padding:13px;text-align:center;cursor:pointer;background:linear-gradient(160deg,#fff,#e0f2fe);border:1.5px solid #7dd3fc;border-radius:8px;font-size:20px;font-weight:700;color:var(--sky-deeper);box-shadow:0 5px 0 #7dd3fc,0 7px 10px rgba(3,105,161,.15);position:relative;top:0;transition:all .12s;user-select:none;}
.pin-key:hover{top:2px;box-shadow:0 3px 0 #7dd3fc;}
.pin-key:active{top:5px;box-shadow:0 1px 0 #7dd3fc;}
/* TABLE */
table{width:100%;border-collapse:collapse;font-size:13px;border:1px solid #e0f2fe;}
th{background:#e0f2fe;color:var(--sky-deeper);font-weight:700;padding:9px 10px;text-align:left;border-bottom:2px solid #7dd3fc;border-right:1px solid #bae6fd;}
th:last-child{border-right:none;}
td{padding:8px 10px;border-bottom:1px solid #bae6fd;border-right:1px solid #bae6fd;vertical-align:middle;color:var(--navy-mid);}
td:last-child{border-right:none;}
tr:hover td{background:#fef3c7;}
.table-wrap{overflow-x:auto;border-radius:var(--r);}
/* FORMS */
.form-group{margin-bottom:13px;}
.form-group label{display:block;font-size:12px;color:#64748b;margin-bottom:5px;font-weight:600;}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
input,select{width:100%;padding:9px 12px;border-radius:8px;background:#f0f9ff;border:1.5px solid #7dd3fc;color:var(--navy-mid);font-size:14px;}
input:focus,select:focus{outline:none;border-color:var(--sky-dark);box-shadow:0 0 0 3px rgba(3,105,161,.15);}
select option{background:#fff;}
/* ATTENDANCE */
.att-row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid #e0f2fe;}
.att-row:last-child{border-bottom:none;}
.att-name{flex:1;font-size:13px;font-weight:500;color:var(--navy-mid);}
.att-p{width:38px;height:38px;border-radius:8px;border:none;cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center;background:linear-gradient(160deg,#86efac,#16a34a);color:#fff;box-shadow:0 4px 0 #15803d;position:relative;top:0;transition:all .12s;}
.att-p:hover{top:2px;box-shadow:0 2px 0 #15803d;}
.att-p:active{top:4px;box-shadow:0 1px 0 #15803d;}
.att-p.on{background:linear-gradient(160deg,#4ade80,#16a34a);box-shadow:0 2px 0 #15803d;top:2px;}
.att-a{width:38px;height:38px;border-radius:8px;border:none;cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center;background:linear-gradient(160deg,#fca5a5,#dc2626);color:#fff;box-shadow:0 4px 0 #991b1b;position:relative;top:0;transition:all .12s;}
.att-a:hover{top:2px;box-shadow:0 2px 0 #991b1b;}
.att-a:active{top:4px;box-shadow:0 1px 0 #991b1b;}
.att-a.on{background:linear-gradient(160deg,#f87171,#dc2626);box-shadow:0 2px 0 #991b1b;top:2px;}
.locked-tag{font-size:10px;background:#fef3c7;border:1px solid #f59e0b;color:#92400e;border-radius:4px;padding:2px 6px;margin-left:5px;}
/* STARS */
.stars{display:inline-flex;gap:3px;}
.star{color:#bae6fd;font-size:22px;cursor:pointer;transition:color .1s;}
.star.on{color:var(--gold);}
/* ALERTS */
.alert{padding:10px 14px;border-radius:8px;font-size:13px;margin-bottom:12px;}
.alert-err{background:#fef2f2;border:1.5px solid #fca5a5;color:#991b1b;}
.alert-ok{background:#f0fdf4;border:1.5px solid #86efac;color:#15803d;}
.alert-info{background:#eff6ff;border:1.5px solid #93c5fd;color:#1d4ed8;}
.alert-warn{background:#fffbeb;border:1.5px solid #fcd34d;color:#92400e;}
/* MODAL */
.modal-bg{position:fixed;inset:0;background:rgba(12,26,46,.7);display:flex;align-items:flex-start;justify-content:center;z-index:200;padding:30px 16px;overflow-y:auto;}
.modal-bg.hidden{display:none;}
.modal{background:#fff;border:2px solid var(--sky-mid);border-radius:var(--rl);padding:24px;width:100%;max-width:500px;margin:auto;box-shadow:0 20px 40px rgba(12,26,46,.3);}
.modal h3{color:var(--sky-deeper);font-size:17px;font-weight:700;margin-bottom:18px;}
/* MISC */
.empty{text-align:center;padding:36px 16px;color:#64748b;}
.empty div{font-size:36px;margin-bottom:10px;}
.spinner{border:3px solid #bae6fd;border-top-color:var(--sky-dark);border-radius:50%;width:32px;height:32px;animation:spin .8s linear infinite;margin:40px auto;}
@keyframes spin{to{transform:rotate(360deg);}}
.back-btn{display:inline-flex;align-items:center;gap:6px;color:var(--sky-deeper);cursor:pointer;font-size:14px;font-weight:700;margin-bottom:18px;background:none;border:none;padding:0;}
.section-title{font-size:17px;font-weight:700;color:var(--sky-deeper);margin-bottom:14px;}
.hidden{display:none!important;}
.flex{display:flex;}.gap-2{gap:8px;}.gap-3{gap:12px;}.items-center{align-items:center;}.justify-between{justify-content:space-between;}.flex-wrap{flex-wrap:wrap;}
.mt-3{margin-top:12px;}.mb-3{margin-bottom:12px;}.text-center{text-align:center;}
.month-bar{display:flex;gap:8px;align-items:center;margin-bottom:16px;flex-wrap:wrap;}
.month-bar select{width:auto;min-width:130px;}
.login-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:16px;max-width:680px;margin:0 auto;}
.lcard{background:linear-gradient(160deg,#fff,#e0f2fe);border:1.5px solid var(--sky-mid);border-radius:var(--rl);padding:26px 18px;text-align:center;cursor:pointer;box-shadow:0 8px 0 #7dd3fc,0 10px 16px rgba(3,105,161,.2);position:relative;top:0;transition:all .15s;}
.lcard:hover{top:3px;box-shadow:0 5px 0 #7dd3fc,0 7px 12px rgba(3,105,161,.2);}
.lcard:active{top:8px;box-shadow:0 1px 0 #7dd3fc;}
.lcard .ic{font-size:40px;margin-bottom:10px;}
.lcard h3{color:var(--sky-deeper);font-size:15px;font-weight:700;margin-bottom:4px;}
.lcard p{font-size:11px;color:#64748b;}
.award-card{background:linear-gradient(135deg,#0c4a6e,#075985);border-radius:var(--rl);padding:18px;text-align:center;box-shadow:0 4px 12px rgba(12,42,78,.3);}
.award-card .tr{font-size:36px;margin-bottom:8px;}
.award-card h4{color:var(--gold-light);font-size:14px;font-weight:700;}
.chip{display:inline-flex;align-items:center;gap:6px;background:#fff;border:1.5px solid #7dd3fc;border-radius:8px;padding:6px 14px;font-size:13px;color:var(--sky-deeper);font-weight:600;cursor:pointer;box-shadow:0 4px 0 #7dd3fc;position:relative;top:0;transition:all .12s;margin:3px;}
.chip:hover{top:2px;box-shadow:0 2px 0 #7dd3fc;}
.chip:active{top:4px;box-shadow:0 1px 0 #7dd3fc;}
.confirm-box{background:#fffbeb;border:2px solid #fcd34d;border-radius:var(--r);padding:18px;text-align:center;margin-bottom:16px;}
.confirm-box .ci{font-size:36px;margin-bottom:8px;}
.confirm-box p{color:#92400e;font-size:14px;line-height:1.6;}
@media(max-width:600px){.app-main{padding:14px 10px;}.form-row{grid-template-columns:1fr;}.lcard{padding:18px 12px;}}

/* ═══ APPLE GLASS THEME (cream glass + golden border) ═══ */
:root{--glass:linear-gradient(145deg,rgba(255,253,245,.88),rgba(255,247,225,.66));--gb:#d4a017;--ink:#1f1a0e;--ink2:#4b4636;}
body{color:var(--ink);background:
  radial-gradient(circle at 10% 8%,rgba(252,211,77,.40) 0,transparent 38%),
  radial-gradient(circle at 92% 14%,rgba(56,189,248,.38) 0,transparent 42%),
  radial-gradient(circle at 55% 100%,rgba(251,207,232,.45) 0,transparent 48%),
  linear-gradient(160deg,#e0f2fe,#fff8e7 55%,#bae6fd);background-attachment:fixed;}
.app-header,.app-footer{background:linear-gradient(145deg,rgba(255,253,245,.82),rgba(255,244,214,.68))!important;backdrop-filter:blur(20px) saturate(180%);-webkit-backdrop-filter:blur(20px) saturate(180%);color:#0c3558!important;}
.app-header{border-bottom:2px solid var(--gb)!important;box-shadow:0 8px 28px rgba(160,110,10,.18);}
.app-footer{border-top:2px solid var(--gb)!important;}
.title-group h1{color:#0c3558!important;}
.title-group p,#liveClock,#liveOnlineDiv{color:#3d3520!important;}
.logo{border-color:#fff;box-shadow:0 0 0 2px var(--gb),0 4px 10px rgba(160,110,10,.3);}
.card,.modal,.lcard,.award-card,.stat-card,.confirm-box{
  background:var(--glass)!important;border:1.5px solid var(--gb)!important;
  backdrop-filter:blur(18px) saturate(170%);-webkit-backdrop-filter:blur(18px) saturate(170%);
  box-shadow:0 10px 34px rgba(120,80,10,.16),inset 0 1px 0 rgba(255,255,255,.95),inset 0 0 0 1px rgba(255,255,255,.5)!important;color:var(--ink);}
.lcard{transition:transform .2s;}
.lcard:hover{transform:translateY(-4px);}
.lcard:active{transform:translateY(0);}
.lcard h3,.card-title,.modal h3,.section-title{color:#0c3558!important;}
.lcard p{color:var(--ink2)!important;}
.sc-val{color:#0c3558!important;}
.sc-label{color:var(--ink2)!important;}
.award-card h4{color:#0c3558!important;}
.award-card p{color:#1f1a0e!important;}
.confirm-box p{color:#0c3558;}
.modal-bg{backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);background:rgba(60,40,10,.45);}
.tab,.chip,.pin-key{background:linear-gradient(145deg,rgba(255,253,245,.9),rgba(255,244,214,.7))!important;border:1.5px solid var(--gb)!important;color:#0c3558!important;backdrop-filter:blur(10px);box-shadow:0 4px 0 #e6c15a,0 6px 10px rgba(160,110,10,.12)!important;}
.tab.active{background:linear-gradient(160deg,#fcd34d,#f59e0b)!important;color:#3b2a0a!important;box-shadow:0 2px 0 #b45309!important;}
.chip[style*="background"]{background:rgba(255,251,235,.85)!important;}
input,select{background:rgba(255,255,255,.75)!important;border:1.5px solid #e0b640!important;color:var(--ink)!important;}
input:focus,select:focus{border-color:var(--gb)!important;box-shadow:0 0 0 3px rgba(212,160,23,.25)!important;}
.form-group label{color:#4b4636;}
table{border-color:rgba(212,160,23,.35);background:rgba(255,255,255,.35);}
th{background:rgba(254,243,199,.8)!important;color:#0c3558!important;border-bottom:2px solid var(--gb)!important;border-right-color:rgba(212,160,23,.3)!important;}
td{color:var(--ink)!important;border-color:rgba(212,160,23,.25)!important;}
tr:hover td{background:rgba(252,211,77,.28)!important;}
.alert{backdrop-filter:blur(8px);}
.empty,.empty p{color:var(--ink2);}
p[style*="color:#64748b"],div[style*="color:#64748b"],span[style*="color:#64748b"]{color:var(--ink2)!important;}
[style*="background:#f0f9ff"]{background:rgba(255,251,235,.85)!important;border-color:var(--gb)!important;}
.back-btn{color:#0c3558;}

.title-group h1{color:#0c3558!important;}
#dailyQuoteDiv p,[style*="color:#92400e"]{color:#1f1a0e!important;}
.app-footer a{color:#0c3558;font-weight:700;text-decoration:underline;text-underline-offset:3px;}
.app-footer a:hover{color:#075985;}
.header-right{display:flex;align-items:center;gap:10px;}
.hdr-stats{display:flex;flex-direction:column;align-items:flex-end;gap:2px;font-size:12px;line-height:1.3;color:#1f1a0e;white-space:nowrap;}
.hdr-stats b{color:#0c3558;}
@media(max-width:480px){.hdr-stats{font-size:10px;}}
/* CLASS PHOTOS */
.photo-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;align-items:start;}
.photo-grid.n1{grid-template-columns:1fr;}
.photo-grid.n3 .photo-item:first-child{grid-column:1 / -1;}
.photo-item{position:relative;}
.photo-item img{width:100%;height:auto;max-height:65vh;object-fit:contain;display:block;border-radius:10px;border:1.5px solid var(--gb);background:rgba(255,255,255,.6);}
.photo-grid.n1 .photo-item img,.photo-grid.n3 .photo-item:first-child img{max-height:80vh;}
a.prot{display:block;position:relative;width:100%;height:0;}
a.prot img.rotimg{position:absolute;top:50%;left:50%;height:auto;max-height:none!important;transform:translate(-50%,-50%) rotate(-90deg);}
.stat-grid3{grid-template-columns:repeat(3,1fr);gap:8px;}
@media(max-width:480px){.stat-grid3 .stat-card{padding:10px 4px;}.stat-grid3 .sc-val{font-size:20px;}.stat-grid3 .sc-label{font-size:10px;}}
/* LOGIN CARDS: Admin / Teacher / Parent always in one row */
.login-cards{grid-template-columns:repeat(3,1fr);gap:10px;max-width:680px;}
@media(max-width:480px){
  .login-cards{gap:8px;}
  .lcard{padding:14px 4px 12px;}
  .lcard .ic{font-size:28px;margin-bottom:6px;}
  .lcard h3{font-size:13px;line-height:1.25;margin-bottom:3px;}
  .lcard p{font-size:10px;line-height:1.25;}
}
.photo-del{position:absolute;top:6px;right:6px;width:30px;height:30px;border-radius:50%;border:none;cursor:pointer;background:#dc2626;color:#fff;font-size:14px;box-shadow:0 2px 6px rgba(0,0,0,.3);}

/* WHATSAPP TAB */
textarea{width:100%;padding:9px 12px;border-radius:8px;background:#f0f9ff;border:1.5px solid #7dd3fc;color:var(--navy-mid);font-size:14px;font-family:inherit;line-height:1.5;resize:vertical;min-height:150px;}
textarea:focus{outline:none;border-color:var(--sky-dark);box-shadow:0 0 0 3px rgba(3,105,161,.15);}
.wa-preview{background:#dcf8c6;border-radius:10px;padding:10px 14px;font-size:13px;white-space:pre-wrap;color:#0c1a2e;border:1px solid #b7e4a0;}
.wa-sent{opacity:.55;}
.wa-badge{display:inline-block;padding:2px 9px;border-radius:20px;font-size:11px;font-weight:700;background:#fee2e2;color:#b91c1c;}

/* VISUAL-ONLY BLUE APPLE GLASS THEME */
:root{--glass:linear-gradient(145deg,rgba(225,245,255,.82),rgba(105,190,255,.34));--gb:#59baff;--ink:#082c55;--ink2:#174e82;--gold:#f5c84b;--gold-light:#ffe78a;}
body{color:var(--ink);background:radial-gradient(circle at 12% 8%,rgba(87,190,255,.48),transparent 35%),radial-gradient(circle at 85% 14%,rgba(130,210,255,.38),transparent 42%),radial-gradient(circle at 50% 100%,rgba(0,90,190,.38),transparent 50%),linear-gradient(160deg,#dff5ff,#8ecdf5 48%,#07539a);background-attachment:fixed;}

.app-header{box-shadow:0 8px 28px rgba(0,55,120,.24);}.title-group h1{color:#fff!important}.title-group p,#liveClock,#liveOnlineDiv{color:#d8f3ff!important}.logo{background:linear-gradient(145deg,#5fd3ff,#0676d5)!important;color:#fff!important;border-color:#e5f8ff;box-shadow:0 0 0 2px #5abaff,0 4px 14px rgba(0,80,170,.35);}

<body>
<header class="app-header">
  <div class="logo">ॐ</div>
  <div class="title-group"><h1>जैन पाठशाला</h1><p>श्री अरिहंत विकास समिति</p></div>
  <div id="liveClock" class="hidden" style="margin-left:16px;font-size:12px;color:#bae6fd;white-space:nowrap;"></div>
  <div class="header-right">
    <div class="hdr-stats">
      <div>🟢 अभी ऑनलाइन: <b id="liveOnlineCount">-</b></div>

  </div>
</header>
<main class="app-main" id="appMain"><div class="spinner"></div></main>
<footer class="app-footer">🙏 श्री अरिहंत विकास समिति, चन्द्र शेखर आजाद नगर, भीलवाड़ा, राजस्थान 🙏<div style="margin-top:6px;font-size:13px;"><a href="https://csa-arihant.github.io/jain-panchang/" target="_blank" rel="noopener">जैन पंचांग के लिए क्लिक करें</a></div><div style="margin-top:4px;font-size:10px;opacity:.55;">v15</div></footer>
<div class="modal-bg hidden" id="modalBg"><div class="modal" id="modalBox"></div></div>

<script src="config.js"></script>
<script>
// SUPABASE_URL and SUPABASE_KEY now come from config.js (loaded above)
const API=SUPABASE_URL+'/rest/v1/';
const H={'apikey':SUPABASE_KEY,'Authorization':'Bearer '+SUPABASE_KEY,'Content-Type':'application/json','Prefer':'return=representation'};

let ME=null;

async function db(path,method='GET',body=null,extra={}){
  const opts={method,headers:{...H,...extra}};
  if(body) opts.body=JSON.stringify(body);
  console.log('DB CALL:',method,path,body||'');
  const r=await fetch(API+path,opts);
  if(!r.ok){
    const e=await r.json().catch(()=>({message:r.statusText}));
    console.error('DB ERROR:',r.status,e);
    throw new Error((e.message||r.statusText)+(e.hint?(' | Hint: '+e.hint):'')+(e.details?(' | '+e.details):''));
  }
  if(r.status===204) return null;
  const data=await r.json().catch(()=>null);
  console.log('DB RESULT:',data);
  return data;
}
const dbGet=p=>db(p);
const dbPost=(p,b)=>db(p,'POST',b);
const dbPatch=(p,b)=>db(p,'PATCH',b);
const dbDelete=p=>db(p,'DELETE');
const dbUpsert=(p,b)=>db(p,'POST',b,{'Prefer':'resolution=merge-duplicates,return=representation'});

window.addEventListener('load',()=>{
  const s=sessionStorage.getItem('jpMe');
  if(s)try{ME=JSON.parse(s);}catch(e){}
  ME?(routeMe(),readVisitorCount()):showLanding();
  startClock();
  liveTick();
  setInterval(liveTick,20000);
});

// ── LIVE ONLINE COUNTER ──────────────────────
function getSessionId(){
  let sid=sessionStorage.getItem('jpSessionId');
  if(!sid){
    sid=(crypto.randomUUID?crypto.randomUUID():'s-'+Date.now()+'-'+Math.random().toString(36).slice(2));
    sessionStorage.setItem('jpSessionId',sid);
  }
  return sid;
}

async function liveTick(){
  await heartbeat();
  await loadLiveOnline();
}

async function heartbeat(){
  try{
    await dbUpsert('visitor_sessions?on_conflict=session_id',{session_id:getSessionId(),last_seen:new Date().toISOString()});
    // Occasionally clear out very old sessions so the table doesn't grow forever
    if(Math.random()<0.05){
      const oldCutoff=new Date(Date.now()-86400000).toISOString();
      dbDelete('visitor_sessions?last_seen=lt.'+oldCutoff).catch(()=>{});
    }
  }catch(e){console.warn('heartbeat failed (visitor_sessions table missing?):',e.message);}
}

async function loadLiveOnline(){
  const el=document.getElementById('liveOnlineCount');
  if(!el)return;
  try{
    const cutoff=new Date(Date.now()-90000).toISOString(); // active in last 90s
    const rows=await dbGet('visitor_sessions?last_seen=gte.'+cutoff+'&select=session_id');
    el.textContent=(rows||[]).length;
  }catch(e){el.textContent='-';}
}

function startClock(){
  function tick(){
    const el=document.getElementById('liveClock');
    if(!el)return;
    const d=new Date();
    const dd=String(d.getDate()).padStart(2,'0');
    const mm=String(d.getMonth()+1).padStart(2,'0');
    const yyyy=d.getFullYear();
    let h=d.getHours();const ampm=h>=12?'PM':'AM';h=h%12;if(h===0)h=12;
    const mi=String(d.getMinutes()).padStart(2,'0');
    const se=String(d.getSeconds()).padStart(2,'0');
    el.textContent='📅 '+dd+'-'+mm+'-'+yyyy+'  🕐 '+h+':'+mi+':'+se+' '+ampm;
  }
  tick();
  setInterval(tick,1000);
}

function routeMe(){
  document.getElementById('logoutBtn').classList.remove('hidden');
  document.getElementById('liveClock')?.classList.remove('hidden');
  ME.role==='admin'?showAdmin():ME.role==='teacher'?showTeacher():showParentSearch();
}
function logout(){
  ME=null;sessionStorage.removeItem('jpMe');
  document.getElementById('logoutBtn').classList.add('hidden');
  document.getElementById('liveClock')?.classList.add('hidden');
  showLanding();
}
function saveMe(o){ME=o;sessionStorage.setItem('jpMe',JSON.stringify(o));}

// ── LANDING ──────────────────────────────────
async function showLanding(){
  document.getElementById('liveClock')?.classList.add('hidden');
  setMain(`
    <div class="text-center" style="margin-bottom:20px;">
      <div style="font-size:56px;margin-bottom:12px;">🙏</div>
      <h1 style="font-size:30px;font-weight:800;color:var(--sky-deeper);margin-bottom:8px;">जैन पाठशाला</h1>
      <p style="color:#64748b;">श्री अरिहंत विकास समिति — भीलवाड़ा</p>
    </div>

    <div id="dailyQuoteDiv" class="mb-3"></div>
    <div id="panchangDiv" class="mb-3"></div>
    <div id="photoDiv" class="mb-3"></div>
    <div id="lastClassDiv" class="mb-3"></div>
    <div id="birthdayDiv"></div>
    <div id="winnersDiv" class="mb-3"></div>

    <div class="login-cards mb-3">
      <div class="lcard" onclick="showAdminLogin()"><div class="ic">👑</div><h3>Admin</h3><p>सम्पूर्ण प्रबंधन</p></div>
      <div class="lcard" onclick="showTeacherLogin()"><div class="ic">📚</div><h3>शिक्षक / शिक्षिका</h3><p>उपस्थिति एवं प्रदर्शन</p></div>
      <div class="lcard" onclick="showParentSearch()"><div class="ic">👨‍👩‍👧</div><h3>अभिभावक</h3><p>बच्चे की जानकारी</p></div>
    </div>

    <div id="visitorDiv" class="text-center"></div>
  `);
  loadDailyQuote();
  loadPanchang();
  loadLandingPhotos();
  loadLastClass();
  loadBirthdays();
  loadLandingWinners();
  bumpVisitorCount();
}

// ── 1. VISITOR COUNTER ────────────────────────
async function readVisitorCount(){
  try{
    const rows=await dbGet('visitor_count?id=eq.1&select=count');
    const tc=document.getElementById('liveTotalCount');
    if(tc&&rows&&rows.length)tc.textContent=rows[0].count||0;
  }catch(e){}
}
async function bumpVisitorCount(){
  const el=document.getElementById('visitorDiv');
  try{
    // Try fetch existing counter row
    let rows=await dbGet('visitor_count?id=eq.1&select=count');
    let newCount;
    if(rows&&rows.length){
      newCount=(rows[0].count||0)+1;
      await dbPatch('visitor_count?id=eq.1',{count:newCount});
    } else {
      newCount=1;
      await dbPost('visitor_count',{id:1,count:1});
    }
    const tc=document.getElementById('liveTotalCount');if(tc)tc.textContent=newCount;
  }catch(e){
    if(el)el.innerHTML='';
    console.warn('Visitor counter table missing — run updated SQL to enable.');
  }
}

// ── 2. MONTHLY WINNERS DISPLAY ────────────────
async function loadLandingWinners(){
  const el=document.getElementById('winnersDiv');
  if(!el)return;
  try{
    const d=new Date();
    const my=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
    const prevD=new Date(d.getFullYear(),d.getMonth()-1,1);
    const prevMy=`${prevD.getFullYear()}-${String(prevD.getMonth()+1).padStart(2,'0')}`;
    let data=await dbGet('monthly_awards?month_year=eq.'+my+'&select=award_type,students(name,salutation)');
    let usedMy=my;
    if(!data||!data.length){
      data=await dbGet('monthly_awards?month_year=eq.'+prevMy+'&select=award_type,students(name,salutation)');
      usedMy=prevMy;
    }
    // Prizes not declared -> show nothing on the main display
    if(!data||!data.length){el.innerHTML='';return;}
    const att=data.filter(x=>x.award_type==='attendance');
    const perf=data.filter(x=>x.award_type==='performance');
    const blk=(icon,title,list)=>list.length?`<div class="award-card"><div class="tr">${icon}</div><h4>${title}</h4>
      ${list.map(x=>`<p style="font-weight:700;margin-top:6px;">${x.students?.salutation||''} ${x.students?.name||''}</p>`).join('')}</div>`:'';
    const blocks=[blk('🏅','सर्वश्रेष्ठ उपस्थिति',att),blk('⭐','सर्वश्रेष्ठ प्रदर्शन',perf)].filter(Boolean);
    if(!blocks.length){el.innerHTML='';return;}
    el.innerHTML=`
      <div class="card" style="max-width:680px;margin:0 auto;">
        <div class="card-title" style="justify-content:center;">🏆 मासिक विजेता — ${monthLabel(usedMy)}</div>
        <div class="form-row" style="${blocks.length===1?'grid-template-columns:1fr;':''}">${blocks.join('')}</div>
      </div>`;
  }catch(e){el.innerHTML='';}
}

// ── LAST COMPLETED CLASS SUMMARY (before login) ──
async function loadLastClass(){
  const el=document.getElementById('lastClassDiv');
  if(!el)return;
  try{
    const rows=await dbGet('class_dates?is_active=eq.true&class_date=lte.'+today()+'&order=class_date.desc&limit=1&select=id,class_date');
    if(!rows||!rows.length){el.innerHTML='';return;}
    const cd=rows[0];
    const [stus,att]=await Promise.all([
      dbGet('students?select=id,joining_date,is_active'),
      dbGet('attendance?class_date_id=eq.'+cd.id+'&select=status')
    ]);
    if(!att||!att.length){el.innerHTML='';return;}
    const total=(stus||[]).filter(s=>s.is_active!==false&&(!s.joining_date||s.joining_date<=cd.class_date)).length;
    const present=att.filter(r=>r.status==='present').length;
    const pct=total?Math.round(present/total*100):0;
    el.innerHTML=`<div class="card" style="max-width:680px;margin:0 auto;">
      <div class="card-title" style="justify-content:center;">📚 ${cd.class_date===today()?'आज की कक्षा':'पिछली कक्षा'} — ${fmtDate(cd.class_date)}</div>
      <div class="stat-grid stat-grid3" style="margin-bottom:0;">
        <div class="stat-card"><div class="sc-val">${total}</div><div class="sc-label">कुल विद्यार्थी</div></div>
        <div class="stat-card"><div class="sc-val">${present}</div><div class="sc-label">उपस्थित</div></div>
        <div class="stat-card"><div class="sc-val">${pct}%</div><div class="sc-label">उपस्थिति दर</div></div>
      </div>
    </div>`;
  }catch(e){el.innerHTML='';}
}
function monthLabel(my){
  if(!my)return '';
  const [y,m]=my.split('-');
  const dt=new Date(parseInt(y),parseInt(m)-1,1);
  return dt.toLocaleDateString('hi-IN',{year:'numeric',month:'long'});
}

// ── 3. BIRTHDAY NOTIFICATION ──────────────────
async function loadBirthdays(targetId='birthdayDiv'){
  const el=document.getElementById(targetId);
  if(!el)return;
  try{
    const today=new Date();
    const tomorrow=new Date(today);tomorrow.setDate(today.getDate()+1);
    const tMM=String(today.getMonth()+1).padStart(2,'0'),tDD=String(today.getDate()).padStart(2,'0');
    const mMM=String(tomorrow.getMonth()+1).padStart(2,'0'),mDD=String(tomorrow.getDate()).padStart(2,'0');

    const students=((await dbGet('students?select=name,salutation,dob,is_active'))||[]).filter(s=>s.is_active!==false);
    let teachers=[];
    try{ teachers=await dbGet('teachers?select=name,salutation,dob'); }catch(e){ teachers=[]; }

    let html='';
    const checkPerson=(p,label)=>{
      if(!p.dob)return;
      const d=new Date(p.dob+'T00:00:00');
      const mm=String(d.getMonth()+1).padStart(2,'0'),dd=String(d.getDate()).padStart(2,'0');
      if(mm===tMM&&dd===tDD){
        html+=`<div class="confirm-box" style="background:#fdf4ff;border-color:#e9d5ff;margin-bottom:10px;">
          <div class="ci">🎂🎉</div>
          <p style="color:#86198f;"><b>जन्मदिन मुबारक हो!</b><br>${label} ${p.salutation} ${p.name} 🎈</p>
        </div>`;
      } else if(mm===mMM&&dd===mDD){
        html+=`<div class="alert alert-info mb-3" style="text-align:center;">
          🎂 कल ${label} <b>${p.salutation} ${p.name}</b> का जन्मदिन है!
        </div>`;
      }
    };

    (students||[]).forEach(s=>checkPerson(s,'विद्यार्थी'));
    (teachers||[]).forEach(t=>checkPerson(t,'शिक्षक/शिक्षिका'));

    el.innerHTML=html;

  }catch(e){el.innerHTML='';}
}

// ── 4. DAILY QUOTE ─────────────────────────────
const HINDI_QUOTES=[
  'ज्ञान से सेवा की ओर, सेवा से मुक्ति की ओर।',
  'अहिंसा परमो धर्मः — जैन धर्म का मूल मंत्र।',
  'क्षमा वीरस्य भूषणम् — क्षमा वीरों का आभूषण है।',
  'जियो और जीने दो — यही सच्चा जैन धर्म है।',
  'संयम से ही आत्मा की शुद्धि होती है।',
  'सत्य ही सबसे बड़ा तप है।',
  'जो स्वयं को जीतता है, वही सच्चा विजेता है।',
  'त्याग में ही वास्तविक सुख छिपा है।',
  'प्रत्येक जीव में परमात्मा का वास है — सबका सम्मान करें।',
  'अपरिग्रह से मन को शांति मिलती है।',
  'विद्या वही है जो विनय दे।',
  'सच्ची सेवा वही है जो निःस्वार्थ हो।',
  'धैर्य और संयम सफलता की कुंजी हैं।',
  'जैसा बोओगे, वैसा काटोगे — कर्मों का फल अवश्य मिलता है।',
  'मन की शुद्धता ही सच्ची पूजा है।'
];
function loadDailyQuote(){
  const el=document.getElementById('dailyQuoteDiv');
  if(!el)return;
  const dayIdx=Math.floor(Date.now()/86400000)%HINDI_QUOTES.length;
  const quote=HINDI_QUOTES[dayIdx];
  el.innerHTML=`<div class="card text-center" style="max-width:600px;margin:0 auto;background:linear-gradient(135deg,#fef9c3,#fef3c7);border-color:#fcd34d;">
    <p style="font-size:14px;color:#92400e;font-style:italic;">📿 "${quote}"</p>
  </div>`;
}

// ── 5. JAIN PANCHANG (basic tithi/date info) ──
async function loadPanchang(){
  const el=document.getElementById('panchangDiv');
  if(!el)return;
  const today=new Date();
  const dd=String(today.getDate()).padStart(2,'0');
  const mm=String(today.getMonth()+1).padStart(2,'0');
  const yyyy=today.getFullYear();
  const weekday=today.toLocaleDateString('hi-IN',{weekday:'long'});

  const festivals={
    '03-22':'महावीर जयंती 🙏',
  };
  const key=mm+'-'+dd;
  const festival=festivals[key]||null;

  let nextClassHtml='';
  try{
    const todayIso=yyyy+'-'+mm+'-'+dd; // local date, not UTC

    // 1) Is there an ACTIVE class scheduled for TODAY? → show as "आज की कक्षा"
    const todaysClass=await dbGet('class_dates?class_date=eq.'+todayIso+'&is_active=eq.true&select=class_date&limit=1');
    if(todaysClass&&todaysClass.length){
      nextClassHtml=`<br>📚 आज की कक्षा: <b>${fmtDate(todaysClass[0].class_date)}</b>`;
    }

    // 2) Otherwise, has the teacher/admin explicitly set an upcoming class (next_class_id)?
    if(!nextClassHtml){
      const cfg=await dbGet('admin_config?select=next_class_id,default_class_weekday&limit=1');
      const setId=cfg?.[0]?.next_class_id;
      if(setId){
        const picked=await dbGet('class_dates?id=eq.'+setId+'&class_date=gt.'+todayIso+'&select=class_date');
        if(picked&&picked.length){
          nextClassHtml=`<br>📚 अगली कक्षा: <b>${fmtDate(picked[0].class_date)}</b>`;
        }
      }
      // 3) Otherwise, any future active class already in the DB?
      if(!nextClassHtml){
        const upcoming=await dbGet('class_dates?class_date=gt.'+todayIso+'&is_active=eq.true&order=class_date&limit=1');
        if(upcoming&&upcoming.length){
          nextClassHtml=`<br>📚 अगली कक्षा: <b>${fmtDate(upcoming[0].class_date)}</b>`;
        }
      }
      // 4) Otherwise, compute the next occurrence of the configured default weekday
      //    (defaults to Saturday=6, but is editable by Admin — never hardcoded assumption)
      if(!nextClassHtml){
        const defWeekday=(cfg?.[0]?.default_class_weekday??6);
        const d=new Date(today);
        let add=(defWeekday-d.getDay()+7)%7;
        if(add===0)add=7; // today already handled above, so always roll to next occurrence
        d.setDate(d.getDate()+add);
        const yyyy2=d.getFullYear(),mm2=String(d.getMonth()+1).padStart(2,'0'),dd2=String(d.getDate()).padStart(2,'0');
        nextClassHtml=`<br>📚 अगली कक्षा (अनुमानित): <b>${fmtDate(yyyy2+'-'+mm2+'-'+dd2)}</b>`;
      }
    }
  }catch(e){}

  el.innerHTML=`<div class="card text-center" style="max-width:600px;margin:0 auto;background:linear-gradient(135deg,#e0f2fe,#bae6fd);border-color:#7dd3fc;">
    <p style="font-size:13px;color:var(--sky-deeper);">

function pkey(k,role){
  let p=window._pin||'';
  if(k==='⌫')p=p.slice(0,-1);
  else if(k===''||p.length>=4)return;
  else p+=k;
  window._pin=p;
  for(let i=0;i<4;i++){const d=document.getElementById('d'+i);if(d)d.classList.toggle('filled',i<p.length);}
  document.getElementById('perr')?.classList.add('hidden');
  if(p.length===4)setTimeout(()=>verifyPin(p,role),200);
}

async function verifyPin(pin,role){
  try{
    if(role==='admin'){
      const data=await dbGet('admin_config?select=pin&limit=1');
      if(data&&data.length&&data[0].pin===pin){
        saveMe({role:'admin'});document.getElementById('logoutBtn').classList.remove('hidden');document.getElementById('liveClock')?.classList.remove('hidden');showAdmin();
      } else pinErr();
    } else {
      const tid=document.getElementById('tSel')?.value;
      if(!tid){pinErr('पहले नाम चुनें।');return;}
      const data=await dbGet('teachers?id=eq.'+tid+'&pin=eq.'+pin+'&limit=1');
      if(data&&data.length){
        saveMe({role:'teacher',data:data[0]});document.getElementById('logoutBtn').classList.remove('hidden');document.getElementById('liveClock')?.classList.remove('hidden');showTeacher();
      } else pinErr();
    }
  }catch(e){pinErr('Error: '+e.message);}
}
function pinErr(msg){
  const el=document.getElementById('perr');
  if(el){if(msg)el.textContent=msg;el.classList.remove('hidden');}
  window._pin='';for(let i=0;i<4;i++){const d=document.getElementById('d'+i);if(d)d.classList.remove('filled');}
}

async function toggleClassDate(id,current){

    : 'इस दिनांक को Active करना चाहते हैं?';

  if(!confirm(msg)) return;

  try{

    await dbPatch(
      'class_dates?id=eq.'+id,
      {is_active:!current}
    );

    toast(
      current
        ? '✅ दिनांक Inactive'
        : '✅ दिनांक Active'
    );

    loadClassDateManager();

  }catch(e){
    toast('Error: '+e.message);

// Shared ranking computation — SAME formula as before, used by both
// the teacher's read-only ranking tables and the admin's manual selection screen.
async function computeAttendanceRanking(my){
  const monthDates=await dbGet('class_dates?month_year=eq.'+my+'&select=id,class_date,duration_minutes,is_active');
  const durById={};(monthDates||[]).forEach(d=>{durById[d.id]=d.duration_minutes||60;});
  // Only classes that are active AND have actually happened (not future-scheduled) count toward the total
  const heldActive=(monthDates||[]).filter(d=>d.is_active&&d.class_date<=today());
  const activeIds=new Set(heldActive.map(d=>d.id));
  const totalMinutes=heldActive.reduce((s,d)=>s+(d.duration_minutes||60),0)||1;

  const att=await dbGet('attendance?month_year=eq.'+my+'&status=eq.present&select=student_id,class_date_id,arrival_time,departure_time');
  const timeToMin=t=>{if(!t)return null;const[h,m]=t.split(':').map(Number);return h*60+m;};
  const minutesByStu={};
  (att||[]).forEach(r=>{
    if(!activeIds.has(r.class_date_id))return; // skip deactivated classes entirely
    const dur=durById[r.class_date_id]||60;
    const a=timeToMin(r.arrival_time),d=timeToMin(r.departure_time);
    let mins=dur; // fallback: full credit if times weren't recorded
    if(a!=null&&d!=null){mins=Math.max(0,Math.min(dur,d-a));}
    minutesByStu[r.student_id]=(minutesByStu[r.student_id]||0)+mins;
  });
  const students=await dbGet('students?select=id,name,salutation,is_active');
  const infoById={};(students||[]).forEach(s=>infoById[s.id]=s);
  return Object.entries(minutesByStu).filter(([sid])=>infoById[sid]?.is_active!==false).map(([sid,mins])=>({
    id:sid,name:infoById[sid]?.name||'',salutation:infoById[sid]?.salutation||'',
    mins,ratio:mins/totalMinutes
  })).sort((a,b)=>b.ratio-a.ratio);
}

async function computePerformanceRanking(my){
  const monthDates=await dbGet('class_dates?month_year=eq.'+my+'&select=id,class_date,is_active');
  const activeIds=new Set((monthDates||[]).filter(d=>d.is_active&&d.class_date<=today()).map(d=>d.id));
  const perf=await dbGet('performance?month_year=eq.'+my+'&select=student_id,rating,class_date_id');
  const pm={};(perf||[]).forEach(r=>{
    if(!activeIds.has(r.class_date_id))return; // skip deactivated / not-yet-happened classes
    if(!pm[r.student_id])pm[r.student_id]=[];pm[r.student_id].push(r.rating);
  });
  const totalHeld=(monthDates||[]).filter(d=>d.is_active&&d.class_date<=today()).length||1;

  const ids=Object.keys(pm);
  const infoById={};let ageDaysById={};
  if(ids.length){
    const studentsInfo=await dbGet('students?id=in.('+ids.join(',')+')&select=id,name,salutation,dob,is_active');
    const todayD=new Date();
    (studentsInfo||[]).forEach(s=>{
      infoById[s.id]=s;
      if(s.dob){const d=new Date(s.dob+'T00:00:00');ageDaysById[s.id]=(todayD-d)/(1000*60*60*24);}
    });
  }
  const validAges=Object.values(ageDaysById);
  const minAgeDays=validAges.length?Math.min(...validAges):0;
  const maxAgeDays=validAges.length?Math.max(...validAges):0;

  return ids.map(id=>{
    const rs=pm[id];
    const avgRating=rs.reduce((a,b)=>a+b,0)/rs.length;
    const attendanceRatio=rs.length/totalHeld;
    const baseScore=avgRating*attendanceRatio;
    const age=ageDaysById[id];
    let ageBonus=0;
    if(age!=null && maxAgeDays>minAgeDays){
      ageBonus=(maxAgeDays-age)/(maxAgeDays-minAgeDays)*0.10; // up to 10% for youngest
    }
    return{
      id,name:infoById[id]?.name||'',salutation:infoById[id]?.salutation||'',
      avgRating,ratingCount:rs.length,score:baseScore*(1+ageBonus)
    };
  }).filter(r=>infoById[r.id]?.is_active!==false).sort((a,b)=>b.score-a.score);
}

async function adminSave(sid,cdId,date){
  const statusEl=document.getElementById('rsa-'+sid);
  const ratingEl=document.getElementById('rsr-'+sid);
  const status=statusEl?.value||'';
  const rating=parseInt(ratingEl?.value)||0;
  const my=date.substring(0,7);
  const msgEl=document.getElementById('rsMsg');
  if(msgEl)msgEl.innerHTML='<div class="alert alert-info">⏳ सहेजा जा रहा है...</div>';
  try{
    // ATTENDANCE: if status empty ("-- चुनें --"), DELETE the record (clear it)
    if(status===''){
      const delResult=await dbDelete('attendance?student_id=eq.'+sid+'&class_date_id=eq.'+cdId);
      console.log('DELETE attendance (cleared):',delResult);
    } else {
      const ex=await dbGet('attendance?student_id=eq.'+sid+'&class_date_id=eq.'+cdId+'&select=id');
      console.log('Existing attendance check:',ex);
      if(ex&&ex.length>0){
        const patchResult=await dbPatch('attendance?student_id=eq.'+sid+'&class_date_id=eq.'+cdId,
          {status,locked:false,edited_once:false});
        console.log('PATCH attendance returned:',patchResult);
      } else {
        const postResult=await dbPost('attendance',{student_id:sid,class_date_id:cdId,date,status,month_year:my,locked:false,edited_once:false});
        console.log('POST attendance returned:',postResult);
        try{
          const stu=await dbGet('students?id=eq.'+sid+'&select=joining_date');
          if(stu?.[0]&&!stu[0].joining_date){
            await dbPatch('students?id=eq.'+sid,{joining_date:date});
          }
        }catch(e){console.error('auto joining_date failed:',e);}
      }
    }

    // PERFORMANCE: only allowed when status is 'present'. If rating is 0, or status isn't
    // present, DELETE the record (clear it) — prevents rating an absent/unmarked student.
    if(rating===0||status!=='present'){
      const delResult=await dbDelete('performance?student_id=eq.'+sid+'&class_date_id=eq.'+cdId);
      console.log('DELETE performance (cleared):',delResult);
    } else {
      const ex=await dbGet('performance?student_id=eq.'+sid+'&class_date_id=eq.'+cdId+'&select=id');
      console.log('Existing performance check:',ex);
      if(ex&&ex.length>0){
        const patchResult=await dbPatch('performance?student_id=eq.'+sid+'&class_date_id=eq.'+cdId,
          {rating,locked:false,edited_once:false});

async function doAddClassDate(tab){
  const date=g('cdDate');
  if(!date){merr('cderr','दिनांक आवश्यक।');return;}
  const my=date.substring(0,7);
  try{
    const inserted=await dbPost('class_dates',{class_date:date,month_year:my});
    const newId=inserted?.[0]?.id;
    // If this is a future date, make it the homepage's "next class" automatically
    if(newId && date>today()){
      try{await dbPatch('admin_config?id=eq.1',{next_class_id:newId});}
      catch(e){console.error('set next_class_id failed:',e);}
    }
    closeModal();
    document.getElementById('apMon').value=my;loadMergedDates();
    toast('📅 '+fmtDate(date)+' जोड़ी गई ✓');
  }catch(e){
    if(e.message.includes('unique')||e.message.includes('duplicate')){merr('cderr','यह दिनांक पहले से जोड़ी जा चुकी है।');}
    else merr('cderr','Error: '+e.message);
  }
}

async function loadMergedSheet(cdId,date){
  const el=document.getElementById('mergedSheetDiv');if(!el)return;
  const stu=(window._stus||[]).filter(s=>s.is_active!==false&&(!s.joining_date||s.joining_date<=date));
  if(!stu.length){el.innerHTML='<div class="empty"><p>इस दिनांक तक कोई विद्यार्थी प्रवेशित नहीं।</p></div>';return;}

  const my=date.substring(0,7);
  try{
    const exAtt=await dbGet('attendance?class_date_id=eq.'+cdId+'&select=student_id,status,locked,edited_once,arrival_time,departure_time');
    const am={};(exAtt||[]).forEach(r=>am[r.student_id]=r);
    const exPerf=await dbGet('performance?class_date_id=eq.'+cdId+'&select=student_id,rating,locked,edited_once');
    const pm={};(exPerf||[]).forEach(r=>pm[r.student_id]=r);
    el.innerHTML=`<div class="card" style="padding:16px;max-width:760px;margin:0 auto;">
      <div class="card-title">📅 ${fmtDate(date)} — उपस्थिति व रेटिंग</div>

      <div id="photoBox-${cdId}" class="mb-3"></div>
      ${stu.map((s,i)=>{
        const arec=am[s.id];
        const alocked=arec?.locked&&arec?.edited_once;
        const isPresent=arec?.status==='present';
        const isAbsent=arec?.status==='absent';
        const pStyle=isPresent
          ? "background:linear-gradient(160deg,#4ade80,#16a34a);color:#fff;box-shadow:0 2px 0 #15803d;top:2px;border:2px solid #16a34a;"
          : "background:#fff;color:#16a34a;box-shadow:0 4px 0 #f59e0b;top:0;border:2px solid #f59e0b;";
        const aStyle=isAbsent
          ? "background:linear-gradient(160deg,#f87171,#dc2626);color:#fff;box-shadow:0 2px 0 #991b1b;top:2px;border:2px solid #dc2626;"
          : "background:#fff;color:#dc2626;box-shadow:0 4px 0 #f59e0b;top:0;border:2px solid #f59e0b;";
        const arr=(arec?.arrival_time||'19:00').substring(0,5);
        const dep=(arec?.departure_time||'20:00').substring(0,5);
        const prec=pm[s.id];
        const plocked=prec?.locked&&prec?.edited_once;
        const pdisabled=plocked||!isPresent;
        return `<div class="att-row" style="flex-wrap:wrap;align-items:flex-start;">
          <div class="att-name" style="width:100%;">${i+1}. ${s.salutation} ${s.name}</div>
          <button id="ap-${cdId}-${s.id}"
            onclick="${alocked?`showLockMsg('mMsg-${cdId}')`:`markAtt('${s.id}','present','${date}','${my}','${cdId}')`}"
            style="width:38px;height:38px;border-radius:8px;cursor:${alocked?'not-allowed':'pointer'};font-size:16px;font-weight:700;display:flex;align-items:center;justify-content:center;position:relative;transition:all .15s;${pStyle}">✓</button>
          <button id="aa-${cdId}-${s.id}"
            onclick="${alocked?`showLockMsg('mMsg-${cdId}')`:`markAtt('${s.id}','absent','${date}','${my}','${cdId}')`}"
            style="width:38px;height:38px;border-radius:8px;cursor:${alocked?'not-allowed':'pointer'};font-size:16px;font-weight:700;display:flex;align-items:center;justify-content:center;position:relative;transition:all .15s;${aStyle}">✗</button>
          <div style="display:flex;align-items:center;gap:4px;margin-left:6px;height:38px;min-width:64px;">
            ${alocked?'<span class="locked-tag" title="उपस्थिति Lock">🔒</span>':''}
            ${plocked?'<span class="locked-tag" title="रेटिंग Lock">🔒</span>':''}
          </div>

            ${[1,2,3,4,5].map(i=>`<span style="color:${i<=(prec?.rating||0)?'var(--gold)':'#bae6fd'};font-size:22px;cursor:${pdisabled?'not-allowed':'pointer'};opacity:${isPresent?'1':'.5'};"
              onclick="${plocked?`showLockMsg('mMsg-${cdId}')`:(!isPresent?`showLockMsg('mMsg-${cdId}','⚠️ पहले विद्यार्थी को उपस्थित दर्ज करें, तभी रेटिंग दी जा सकती है।')`:`setRating('${s.id}','${my}','${cdId}',${i},'${date}')`)}">★</span>`).join('')}

    loadPhotoBox(cdId);

}

      pBtn.style.background='linear-gradient(160deg,#4ade80,#16a34a)';
      pBtn.style.color='#fff';pBtn.style.border='2px solid #16a34a';
      pBtn.style.boxShadow='0 2px 0 #15803d';pBtn.style.top='2px';
    } else {
      pBtn.style.background='#fff';pBtn.style.color='#16a34a';pBtn.style.border='2px solid #f59e0b';
      pBtn.style.boxShadow='0 4px 0 #f59e0b';pBtn.style.top='0';
    }
  }
  if(aBtn){
    if(status==='absent'){
      aBtn.style.background='linear-gradient(160deg,#f87171,#dc2626)';
      aBtn.style.color='#fff';aBtn.style.border='2px solid #dc2626';
      aBtn.style.boxShadow='0 2px 0 #991b1b';aBtn.style.top='2px';
    } else {
      aBtn.style.background='#fff';aBtn.style.color='#dc2626';aBtn.style.border='2px solid #f59e0b';
      aBtn.style.boxShadow='0 4px 0 #f59e0b';aBtn.style.top='0';
    }
  }

  // Show/hide the arrival-departure time row instantly based on status
  const timesDiv=document.getElementById('attTimes-'+cdId+'-'+sid);
  if(timesDiv) timesDiv.style.display = status==='present' ? 'flex' : 'none';

  try{
    const ex=await dbGet('attendance?student_id=eq.'+sid+'&class_date_id=eq.'+cdId+'&select=id,locked,edited_once,arrival_time,departure_time');
    const rec=ex?.[0];
    if(rec?.locked&&rec?.edited_once){showLockMsg(msgElId);await loadMergedSheet(cdId,date);return;}
    const newEditedOnce=!!rec;
    const payload={status,locked:true,edited_once:newEditedOnce};
    if(status==='present'){
      // Default to 7:00 PM–8:00 PM unless already set (or the teacher's current field values)
      const atEl=document.getElementById('at-'+cdId+'-'+sid);
      const dtEl=document.getElementById('dt-'+cdId+'-'+sid);
      payload.arrival_time = (atEl?.value)||rec?.arrival_time||'19:00';
      payload.departure_time = (dtEl?.value)||rec?.departure_time||'20:00';
    }
    if(rec&&rec.id){
      const updated=await dbPatch('attendance?student_id=eq.'+sid+'&class_date_id=eq.'+cdId,payload);
      console.log('PATCH attendance result:',updated);
    } else {
      const inserted=await dbPost('attendance',{student_id:sid,class_date_id:cdId,date,month_year:my,...payload});
      console.log('POST attendance result:',inserted);
      // This is this student's first-ever attendance record — auto-set joining_date
      // to this class's date, unless it's already been set manually.
      try{
        const stu=await dbGet('students?id=eq.'+sid+'&select=joining_date');
        if(stu?.[0]&&!stu[0].joining_date){
          await dbPatch('students?id=eq.'+sid,{joining_date:date});
        }
      }catch(e){console.error('auto joining_date failed:',e);}
    }
    // If marked absent, clear any performance rating that may have been given by mistake
    if(status==='absent'){
      try{await dbDelete('performance?student_id=eq.'+sid+'&class_date_id=eq.'+cdId);}
      catch(e){console.error('clear performance on absent failed:',e);}
    }
    if(msgEl)msgEl.innerHTML='';
    toast('उपस्थिति सहेजी ✓',1200);
    // Refresh in background to sync lock state — colors already updated instantly above
    setTimeout(()=>loadMergedSheet(cdId,date),400);
  }catch(e){
    console.error('markAtt error:',e);
    showLockMsg(msgElId,'❌ Error: '+e.message);
    await loadMergedSheet(cdId,date); // revert to actual DB state on error
  }
}

async function setRating(sid,my,cdId,r,date){
  const msgElId='mMsg-'+cdId;
  const msgEl=document.getElementById(msgElId);

  // Safety check: only present students can be rated
  const attCheck=await dbGet('attendance?student_id=eq.'+sid+'&class_date_id=eq.'+cdId+'&select=status').catch(()=>null);
  if(attCheck?.[0]?.status!=='present'){
    showLockMsg(msgElId,'⚠️ पहले विद्यार्थी को उपस्थित दर्ज करें, तभी रेटिंग दी जा सकती है।');
    await loadMergedSheet(cdId,date);
    return;
  }

  // INSTANT visual feedback — fill stars immediately before DB call
  const stars=document.querySelectorAll('#st-'+cdId+'-'+sid+' span');
  stars.forEach((s,i)=>s.style.color=i<r?'var(--gold)':'#bae6fd');

  try{
    const ex=await dbGet('performance?student_id=eq.'+sid+'&class_date_id=eq.'+cdId+'&select=id,locked,edited_once');
    const rec=ex?.[0];
    if(rec?.locked&&rec?.edited_once){showLockMsg(msgElId);await loadMergedSheet(cdId,date);return;}
    const newEditedOnce=!!rec;
    if(rec&&rec.id){
      const updated=await dbPatch('performance?student_id=eq.'+sid+'&class_date_id=eq.'+cdId,
        {rating:r,locked:true,edited_once:newEditedOnce});
      console.log('PATCH performance result:',updated);
    } else {
      const inserted=await dbPost('performance',{student_id:sid,class_date_id:cdId,rating:r,month_year:my,locked:true,edited_once:false});
      console.log('POST performance result:',inserted);
    }
    if(msgEl)msgEl.innerHTML='';
    toast('रेटिंग सहेजी ✓',1200);
    setTimeout(()=>loadMergedSheet(cdId,date),400);
  }catch(e){
    console.error('setRating error:',e);
    showLockMsg(msgElId,'❌ Error: '+e.message);
    await loadMergedSheet(cdId,date);
  }
}

function showLockMsg(elId,msg){
  const el=document.getElementById(elId);
  if(el)el.innerHTML='<div class="alert alert-err">'+(msg||'🔒 यह रिकॉर्ड Lock हो चुका है। बदलने के लिए Admin से संपर्क करें।')+'</div>';
}

let _st;
async function searchStu(val){
  clearTimeout(_st);
  if(val.length<2){document.getElementById('searchRes').innerHTML='';return;}
  _st=setTimeout(async()=>{
    try{
      const data=await dbGet('students?or=(name.ilike.*'+val+'*,father_phone.ilike.*'+val+'*,mother_phone.ilike.*'+val+'*)&limit=10');
      const el=document.getElementById('searchRes');
      if(!data||!data.length){el.innerHTML='<div class="alert alert-info">कोई विद्यार्थी नहीं मिला।</div>';return;}
      el.innerHTML=data.map(s=>`
        <div onclick="gateParentView('${s.id}','${(s.father_phone||'').replace(/'/g,"")}','${(s.mother_phone||'').replace(/'/g,"")}')" style="background:#f0f9ff;border:1.5px solid #7dd3fc;border-radius:8px;padding:10px 14px;margin-top:8px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;">
          <div><b style="color:var(--sky-deeper)">${s.salutation} ${s.name}</b>
            <div style="font-size:12px;color:#64748b;">${s.father_name?('पिता: '+s.father_name+' | '+maskPhone(s.father_phone)):''}${s.mother_name?(' | माता: '+s.mother_name+' | '+maskPhone(s.mother_phone)):''}</div>
          </div>
          <span style="color:var(--sky-dark);">देखें →</span>
        </div>`).join('');
    }catch(e){}
  },350);
}
function maskPhone(phone){
  if(!phone)return '-';
  const digits=phone.replace(/\D/g,'');
  if(digits.length<=4)return 'XXXX';
  return digits.slice(0,-4)+'XXXX';
}

// Shrinks a phone photo (5-10 MB) to about 200-400 KB before upload.
// The photo is opened through an <img>, which applies the camera's rotation (EXIF),
// so the saved picture always stands upright.
async function compressImage(file){
  const url=URL.createObjectURL(file);
  let img;
  try{
    img=new Image();
    img.src=url;
    await img.decode();
  }catch(e){
    URL.revokeObjectURL(url);
    throw new Error('फोटो खोला नहीं जा सका। कृपया दूसरा फोटो चुनें।');
  }
  const W=img.naturalWidth,H=img.naturalHeight;
  const tries=[[1600,0.75],[1280,0.65],[1000,0.55]];
  let blob=null;
  for(const [maxW,q] of tries){
    const scale=Math.min(1,maxW/Math.max(W,H)); // longest side limited to maxW
    const c=document.createElement('canvas');
    c.width=Math.round(W*scale);c.height=Math.round(H*scale);
    c.getContext('2d').drawImage(img,0,0,c.width,c.height);
    blob=await new Promise(res=>c.toBlob(res,'image/jpeg',q));
    if(blob&&blob.size<=1.8*1024*1024)break;
  }
  URL.revokeObjectURL(url);
  if(!blob)throw new Error('फोटो तैयार नहीं हो सका।');
  return blob;
}

// Any photo that is taller than wide is shown turned to landscape, so group photos
// always use the full width of the screen.
function fitPhoto(img){
  const w=img.naturalWidth,h=img.naturalHeight;
  if(!w||!h||h<=w)return;
  const a=img.closest('a');
  if(!a||a.classList.contains('prot'))return;
  const r=w/h*100;
  a.classList.add('prot');
  a.style.paddingBottom=r+'%';
  img.classList.add('rotimg');
  img.style.width=r+'%';
}

async function uploadClassPhoto(cdId,inp){
  const f=inp.files&&inp.files[0];

  try{
    photoMsg(cdId,'info','⏳ फोटो छोटा किया जा रहा है...');

// Phone → WhatsApp number (India default). Returns '' if invalid.
function waPhone(p){
  let d=String(p||'').replace(/\D/g,'');
  if(d.length===12&&d.startsWith('91'))return d;
  if(d.length===11&&d.startsWith('0'))d=d.slice(1);
  if(d.length===10)return '91'+d;
  return '';
}
function waOpen(url){window.open(url,'_blank','noopener');}

async function waFetchAll(path){
  let out=[],off=0;const step=1000;
  while(true){
    const rows=await dbGet(path+'&limit='+step+'&offset='+off);
    out=out.concat(rows||[]);
    if(!rows||rows.length<step)break;
    off+=step;
  }
  return out;
}

// ── selected months (From..To, inclusive) ──
function waMonths(){
  let a=g('waFrom'),b=g('waTo');
  if(!a||!b)return [];
  if(a>b){const x=a;a=b;b=x;}
  const out=[];let [y,m]=a.split('-').map(Number);const [ey,em]=b.split('-').map(Number);
  while(y<ey||(y===ey&&m<=em)){
    out.push(y+'-'+String(m).padStart(2,'0'));
    m++;if(m>12){m=1;y++;}
    if(out.length>24)break;
  }
  return out;
}
function waPeriodLabel(){
  const ms=waMonths();if(!ms.length)return '';
  return ms.length===1?monthLabel(ms[0])+' माह में':monthLabel(ms[0])+' से '+monthLabel(ms[ms.length-1])+' के बीच';
}
function waPeriodId(){const ms=waMonths();return ms.length?ms[0]+'_'+ms[ms.length-1]:'';}

function waSentKey(){return 'jpWaSent2-'+waPeriodId();}
function waSentGet(){try{return JSON.parse(localStorage.getItem(waSentKey())||'{}');}catch(e){return {};}}
function waSentSet(o){localStorage.setItem(waSentKey(),JSON.stringify(o));}

  waRenderList();
}

const waNm=s=>((s.salutation?s.salutation+' ':'')+s.name).trim();
const waNorm=x=>String(x||'').toLowerCase().replace(/^\s*(shri|shree|smt|sh|mr|mrs|ms)\.?\s+/,'').replace(/[^\p{L}\p{M}\p{N}]+/gu,' ').trim();

async function waLoadList(){
  const months=waMonths();if(!months.length)return;
  const nWrap=document.getElementById('waNWrap');
  if(nWrap)nWrap.style.display=g('waMode')==='n'?'':'none';
  const el=document.getElementById('waListDiv');if(!el)return;
  el.innerHTML='<div class="spinner"></div>';
  try{
    const inList=months.join(',');
    const [dates,att,students]=await Promise.all([
      dbGet('class_dates?month_year=in.('+inList+')&select=id,class_date,is_active&order=class_date'),
      waFetchAll('attendance?month_year=in.('+inList+')&select=student_id,class_date_id,status&order=id'),
      dbGet('students?select=id,salutation,name,class,father_name,father_phone,mother_name,mother_phone,joining_date,is_active&order=name')
    ]);
    // Count only classes that were held (active, not in the future) AND for which attendance was actually taken
    const marked=new Set((att||[]).map(r=>r.class_date_id));
    const held=(dates||[]).filter(d=>d.is_active&&d.class_date<=today()&&marked.has(d.id));
    const presentBy={};
    (att||[]).forEach(r=>{if(r.status==='present'){(presentBy[r.student_id]=presentBy[r.student_id]||new Set()).add(r.class_date_id);}});
    const mode=g('waMode'),n=Math.max(1,parseInt(g('waN'))||2);
    const rows=[];
    (students||[]).filter(s=>s.is_active!==false).forEach(s=>{
      // A student is only expected in classes on/after their joining date
      const elig=held.filter(d=>!s.joining_date||d.class_date>=s.joining_date);
      const total=elig.length;if(!total)return;
      const pres=presentBy[s.id]||new Set();
      const missed=elig.filter(d=>!pres.has(d.id)).length;
      const hit=mode==='month'?(missed===total):(missed>=n);
      if(hit)rows.push({s,missed,total});
    });
    rows.sort((a,b)=>b.missed-a.missed||(a.s.name||'').localeCompare(b.s.name||''));
    _waRows=rows;
    waBuildRecipients();
    el.dataset.heldCount=held.length;
    waRenderList();
  }catch(e){el.innerHTML=`<div class="alert alert-err">Error: ${e.message}</div>`;}
}

// One recipient = one parent (same name + same mobile). All their flagged children go in ONE message.
function waBuildRecipients(){
  const map=new Map();_waNoPhone=[];
  _waRows.forEach(row=>{
    let got=false;
    [['f',row.s.father_name,row.s.father_phone],['m',row.s.mother_name,row.s.mother_phone]].forEach(([role,name,phone])=>{
      const num=waPhone(phone);if(!num)return;
      const key=num+'|'+waNorm(name);
      if(!map.has(key))map.set(key,{num,name:name||'',role,kids:[]});
      const r=map.get(key);if(!r.kids.includes(row))r.kids.push(row);
      got=true;
    });
    if(!got)_waNoPhone.push(row);
  });
  // If father & mother have the SAME number and the SAME children, send just one message to that number
  const merged=new Map();
  map.forEach(r=>{
    const k=r.num+'|'+r.kids.map(x=>x.s.id).sort().join(',');
    if(merged.has(k)){
      const m=merged.get(k);
      if(r.name&&!m.name.includes(r.name))m.name=(m.name?m.name+' एवं ':'')+r.name;
      if(!m.role.includes(r.role))m.role='b';
    }else merged.set(k,{...r});
  });
  _waRecips=[...merged.values()].map(r=>{r.key=r.num+'|'+waNorm(r.name)+'|'+r.kids.map(x=>x.s.id).sort().join(',');return r;});
  _waRecips.sort((a,b)=>Math.max(...b.kids.map(k=>k.missed))-Math.max(...a.kids.map(k=>k.missed))||b.kids.length-a.kids.length||(a.name||'').localeCompare(b.name||''));
}

function waBuildMsg(rec){
  const tpl=document.getElementById('waTpl')?.value||WA_DEF_TPL;
  const period=waPeriodLabel();
  const rel=s=>s.salutation==='Ms'?'आपकी पुत्री':'आपके पुत्र';
  const part=k=>k.missed===k.total?`सभी ${k.total} कक्षाओं में`:`${k.total} में से ${k.missed} कक्षाओं में`;
  let summary;
  if(rec.kids.length===1){
    const k=rec.kids[0];
    summary=`${rel(k.s)} ${waNm(k.s)} ${period} ${part(k)} उपस्थित नहीं हो पाए।`;
  }else{
    summary=`आपके बच्चे ${period} उपस्थित नहीं हो पाए:\n`+rec.kids.map(k=>`• ${waNm(k.s)} — ${k.missed===k.total?`सभी ${k.total} कक्षाएँ छूटीं`:`${k.total} में से ${k.missed} कक्षाएँ छूटीं`}`).join('\n');
  }
  const map={parent:rec.name||'अभिभावक',summary,period};
  return tpl.replace(/\{(\w+)\}/g,(m,k)=>k in map?map[k]:m);
}
function waUpdatePreview(){
  const tpl=document.getElementById('waTpl');
  if(tpl)localStorage.setItem('jpWaTpl2',tpl.value);
  const pv=document.getElementById('waPreview');if(!pv)return;
  const r=_waRecips.find(x=>x.kids.length>1)||_waRecips[0];
  pv.textContent=r?waBuildMsg(r):'(शर्त में कोई विद्यार्थी नहीं)';
}

function waRenderList(){
  const el=document.getElementById('waListDiv');if(!el)return;
  const held=parseInt(el.dataset.heldCount||'0');
  waUpdatePreview();
  if(!held){
    el.innerHTML='<div class="alert alert-warn">चुनी अवधि में अभी तक किसी कक्षा की उपस्थिति दर्ज नहीं हुई, इसलिए सूची नहीं बन सकती।</div>';
    return;
  }
  if(!_waRows.length){
    el.innerHTML=`<div class="empty"><div>🎉</div><p>इस शर्त में कोई विद्यार्थी नहीं (चुनी अवधि में ${held} कक्षाएँ हुईं)।</p></div>`;
    return;
  }
  const sent=waSentGet();
  const roleTxt={f:'पिता',m:'माता',b:'पिता / माता'};
  const noPhone=_waNoPhone.length?`<div class="alert alert-warn" style="margin-top:12px;">📵 इन विद्यार्थियों के अभिभावक का मोबाइल नंबर नहीं है / सही नहीं है: <b>${_waNoPhone.map(r=>waNm(r.s)).join(', ')}</b></div>`:'';
  el.innerHTML=`
    <div class="section-title" style="font-size:15px;">${waPeriodLabel().replace(/ में$/,'')} — ${_waRows.length} विद्यार्थी, ${_waRecips.length} संदेश (चुनी अवधि में ${held} कक्षाएँ हुईं)</div>
    <div class="table-wrap"><table>
      <thead><tr><th>#</th><th>अभिभावक</th><th>बच्चे (छूटीं/कुल)</th><th>भेजें</th></tr></thead>
      <tbody>${_waRecips.map((r,i)=>{
        const done=sent[r.key];
        return `<tr class="${done?'wa-sent':''}">
          <td>${i+1}</td>
          <td><b>${r.name||'अभिभावक'}</b><div style="font-size:11px;color:#64748b;">${roleTxt[r.role]} · 📱 ${r.num.slice(2)}</div></td>
          <td>${r.kids.map(k=>`<div style="margin-bottom:3px;">${waNm(k.s)} <span class="wa-badge">${k.missed}/${k.total}</span> <button class="btn btn-ghost btn-sm" style="padding:2px 8px;font-size:11px;" onclick="waDeactivate('${k.s.id}','${encodeURIComponent(k.s.name||'')}')">⏸ Inactive</button></div>`).join('')}</td>
          <td><button class="btn ${done?'btn-ghost':'btn-green'} btn-sm" onclick="waSendRecip(${i})">${done?'✓ भेजा (फिर से?)':'📲 WhatsApp'}</button></td>
        </tr>`;}).join('')}</tbody>
    </table></div>${noPhone}`;
}

function waSendRecip(i){
  const rec=_waRecips[i];if(!rec)return;
  waOpen('https://wa.me/'+rec.num+'?text='+encodeURIComponent(waBuildMsg(rec)));
  const sent=waSentGet();sent[rec.key]=Date.now();waSentSet(sent);
  setTimeout(waRenderList,300);
}

// ── Group ──
async function waGroupInit(){
  const link=document.getElementById('waGLink');
  if(link&&!link.value)link.value=localStorage.getItem('jpWaGroupLink')||'';
  if(!_waNextClass){
    try{
      const rows=await dbGet('class_dates?is_active=eq.true&class_date=gte.'+today()+'&select=class_date&order=class_date&limit=1');
      _waNextClass=rows?.[0]?.class_date?fmtDate(rows[0].class_date):'(तारीख लिखें)';
    }catch(e){_waNextClass='(तारीख लिखें)';}
  }
  const ta=document.getElementById('waGMsg');
  if(ta&&!ta.value)waGroupTplChange();
  else waGroupPreview();
}
function waGroupTplChange(){
  const k=g('waGTplSel');
  document.getElementById('waGMsg').value=WA_GROUP_TPL[k]||'';
  waGroupPreview();
}
function waGroupText(){
  return (document.getElementById('waGMsg')?.value||'').replace(/\{next_class\}/g,_waNextClass||'(तारीख लिखें)');
}
function waGroupPreview(){
  const pv=document.getElementById('waGPreview');if(!pv)return;
  pv.textContent=waGroupText()||'(संदेश लिखें)';
}
function waSaveGroupLink(){
  const v=g('waGLink');
  if(v)localStorage.setItem('jpWaGroupLink',v);else localStorage.removeItem('jpWaGroupLink');
}
function waGroupSend(){
  const msg=waGroupText();
  if(!msg){toast('पहले संदेश लिखें');return;}
  waOpen('https://wa.me/?text='+encodeURIComponent(msg));
}
async function waGroupOpenLink(){
  const msg=waGroupText();
  const link=g('waGLink');
  const out=document.getElementById('waGMsgOut');
  if(!msg){toast('पहले संदेश लिखें');return;}
  if(!/^https:\/\/chat\.whatsapp\.com\//.test(link)){
    out.innerHTML='<div class="alert alert-err">ऊपर ग्रुप का Invite Link डालें (https://chat.whatsapp.com/...)। WhatsApp ग्रुप → Group info → Invite via link से मिलेगा।</div>';
    return;
  }
  waSaveGroupLink();
  try{
    await navigator.clipboard.writeText(msg);
    out.innerHTML='<div class="alert alert-ok">✅ संदेश कॉपी हो गया — ग्रुप खुलने पर Paste करके Send दबाएँ।</div>';
  }catch(e){
    out.innerHTML='<div class="alert alert-warn">कॉपी नहीं हो पाया — नमूना से संदेश हाथ से कॉपी कर लें।</div>';
  }
  waOpen(link);
}

document.getElementById('modalBg').addEventListener('click',function(e){if(e.target===this)closeModal();});
</script>
